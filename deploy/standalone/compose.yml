# Development qualification stack, derived from midnight-examples
# 7c8c0a0fb0cc8f8f573757185a7710b7ce06ce0d (hello-world/compose.yml).
# Exact image bytes and provenance require separate install-inventory approval.
name: ${TR_STACK_NAME:-tr-standalone-local-smoke}

services:
  node:
    image: midnightntwrk/midnight-node@sha256:c3e46f8beff308b352813cd8904f6480c331504e09060abd671b8a32e1255220
    platform: linux/arm64
    ports:
      - "127.0.0.1:${TR_NODE_PORT:-29944}:9944"
    networks: [ledger]
    volumes:
      - node-data:/node/chain
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":[1]}'
          http://localhost:9944 | grep -q '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexer:
    image: midnightntwrk/indexer-standalone@sha256:ff3f511ab81e7e337b76dd794cfbe0da8d22c43b915ac457557f937bb6e5f868
    platform: linux/arm64
    restart: on-failure
    ports:
      - "127.0.0.1:${TR_INDEXER_PORT:-28088}:8088"
    networks: [ledger]
    volumes:
      - indexer-data:/data
    environment:
      RUST_LOG: indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info
      APP__INFRA__NODE__URL: ws://node:9944
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__STORAGE__PASSWORD: ${TR_INDEXER_PASSWORD:?private indexer password required}
      APP__INFRA__PUB_SUB__PASSWORD: ${TR_INDEXER_PASSWORD:?private indexer password required}
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: ${TR_INDEXER_PASSWORD:?private indexer password required}
      APP__INFRA__SECRET: ${TR_INDEXER_SECRET:?private indexer secret required}
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: e2e-test-dummy-id
    healthcheck:
      test: [CMD-SHELL, "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server@sha256:1288b69dde74551f8bd9a50eba0609e468bd7d3874d3e00d7dd0f45f35800797
    platform: linux/arm64
    command: [midnight-proof-server, -v]
    ports:
      - "127.0.0.1:${TR_PROOF_PORT:-26300}:6300"
    networks: [ledger]
    volumes:
      - ${TR_PROOF_PARAMS_DIR:?absolute path to pinned proof parameters required}:/.cache/midnight/zk-params:ro
    environment:
      RUST_BACKTRACE: full
      MIDNIGHT_PROOF_SERVER_NO_FETCH_PARAMS: "true"

networks:
  ledger:
    internal: true

volumes:
  node-data:
  indexer-data:
