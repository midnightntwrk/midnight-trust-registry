name: Published Package Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published package version, for example 0.1.0-rc1"
        required: true
        type: string
      registry:
        description: "npm registry URL"
        required: false
        default: "https://registry.npmjs.org"
        type: string

permissions:
  contents: read

env:
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

concurrency:
  group: trust-registry-release-smoke-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Published core package import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version-file: .nvmrc

      - name: Smoke test published packages
        run: |
          node scripts/smoke-published-artifacts.mjs \
            --version "${{ inputs.version }}" \
            --registry "${{ inputs.registry }}"
