name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      prepare_run_id:
        description: Successful manual Prepare Keyless Release run ID for this develop commit
        type: string
        required: true
      publish:
        description: Request protected npm publication (off for verification only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: trust-registry-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify previously tested release bytes
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Select committed release candidate
        id: release
        run: node scripts/select-publish-version.mjs --github-output

      - name: Require committed release version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release-set-version.mjs --version "$VERSION" --check

      - name: Require green exact-source CI, Quality, and Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yaml quality.yaml scan.yaml; do
            gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --branch develop \
              --event push --commit "$GITHUB_SHA" --limit 100 --json event,headBranch,headSha,conclusion \
              | node scripts/check-release-push-run.mjs "$GITHUB_SHA" "$workflow"
          done

      - name: Download previously tested release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: bash scripts/download-keyless-npm-artifact.sh "$RUNNER_TEMP/npm-release" "$PREPARE_RUN_ID" "$GITHUB_SHA"

      - name: Verify manifest and exact release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TR_MANIFEST_GITHUB_VERIFIED_COMMIT: "true"
        run: |
          directory="$RUNNER_TEMP/npm-release"
          node scripts/keyless-npm-release.mjs verify "$directory" "$directory/npm-release.manifest.json"

      - name: Record manifest digest for release review
        id: manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          digest="$(sha256sum "$RUNNER_TEMP/npm-release/npm-release.manifest.json" | cut -d ' ' -f 1)"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Source: `%s`\nVersion: `%s`\nPreparation run: `%s`\nManifest SHA-256: `%s`\n' \
            "$GITHUB_SHA" "$VERSION" "$PREPARE_RUN_ID" "$digest" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish reviewed core packages
    needs: prepare
    if: github.ref == 'refs/heads/develop' && inputs.publish == true
    environment:
      name: npm-publish-stable
      url: https://www.npmjs.com/
    permissions:
      contents: read
      actions: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Download reviewed release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: bash scripts/download-keyless-npm-artifact.sh "$RUNNER_TEMP/npm-release" "$PREPARE_RUN_ID" "$GITHUB_SHA"

      - name: Match reviewed manifest digest
        env:
          PREPARED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: node scripts/check-reviewed-manifest-digest.mjs "$RUNNER_TEMP/npm-release/npm-release.manifest.json" "$PREPARED_MANIFEST_SHA256"

      - name: Verify manifest and exact release tarballs after approval
        env:
          GH_TOKEN: ${{ github.token }}
          TR_MANIFEST_GITHUB_VERIFIED_COMMIT: "true"
        run: |
          directory="$RUNNER_TEMP/npm-release"
          node scripts/keyless-npm-release.mjs verify "$directory" "$directory/npm-release.manifest.json"

      - name: Publish packages to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TAG: next
          REGISTRY: https://registry.npmjs.org
          VERSION: ${{ needs.prepare.outputs.version }}
          KEYLESS_NPM_REQUIRED: "true"
          TR_MANIFEST_GITHUB_VERIFIED_COMMIT: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          export TARBALL_DIR="$RUNNER_TEMP/npm-release"
          export MANIFEST_PATH="$TARBALL_DIR/npm-release.manifest.json"
          ./scripts/publish-npm-packages.sh
