name: Milestone Light

on:
  pull_request:
    branches: [milestone-0.1.0]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: milestone-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  light:
    name: Milestone Light
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: compact-version
        run: node scripts/check-compact-version.mjs --github-output
      - name: Restore pinned Compact installation
        id: compact-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/bin/compact
            ~/.compact/
            !~/.compact/**/artifact.zip
          key: tr-compact-v3-ubuntu24.04-setup836895c8-${{ runner.os }}-${{ runner.arch }}-${{ steps.compact-version.outputs.version }}
      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        if: steps.compact-cache.outputs.cache-hit != 'true'
        with:
          compact-version: ${{ steps.compact-version.outputs.version }}
          cache-enabled: 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Add cached Compact to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: node scripts/check-compact-version.mjs --check-installed
        env:
          TR_COMPACT_CACHE_HIT: ${{ steps.compact-cache.outputs.cache-hit }}
      - name: Save verified Compact installation
        if: steps.compact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/bin/compact
            ~/.compact/
            !~/.compact/**/artifact.zip
          key: tr-compact-v3-ubuntu24.04-setup836895c8-${{ runner.os }}-${{ runner.arch }}-${{ steps.compact-version.outputs.version }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: ./run.sh --light
      - run: pnpm --filter @midnight-ntwrk/trust-registry-integration run integration
      - run: pnpm --filter @midnight-ntwrk/trust-registry-api run integration
      - run: pnpm run demo:smoke
