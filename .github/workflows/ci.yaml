name: CI
permissions: {}

env:
  COMPACT_COMPILER_VERSION: 0.30.0

on:
  push:
    branches: [develop, main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "run.sh"
      - "scripts/**"
      - "contracts/**"
      - "packages/**"
      - "adapters/**"
      - "libs/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "run.sh"
      - "scripts/**"
      - "contracts/**"
      - "packages/**"
      - "adapters/**"
      - "libs/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run light validation
        run: ./run.sh --light
