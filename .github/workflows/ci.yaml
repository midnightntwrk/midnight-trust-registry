name: CI
permissions: {}

on:
  push:
    branches: [develop, main, milestone-0.1.0]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "run.sh"
      - ".compact-version"
      - "scripts/**"
      - "contracts/**"
      - "packages/**"
      - "adapters/**"
      - "libs/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches-ignore: [milestone-0.1.0]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "run.sh"
      - ".compact-version"
      - "scripts/**"
      - "contracts/**"
      - "packages/**"
      - "adapters/**"
      - "libs/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Read checked-in Compact version
        id: compact-version
        run: node scripts/check-compact-version.mjs --github-output

      - name: Setup Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: ${{ steps.compact-version.outputs.version }}

      - name: Verify Compact installation
        run: node scripts/check-compact-version.mjs --check-installed

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run light validation
        run: ./run.sh --light

      - name: Run DID and VC integration scenarios
        run: pnpm --filter @midnight-ntwrk/trust-registry-integration run integration

      - name: Smoke test documented demo flow
        run: pnpm run demo:smoke
