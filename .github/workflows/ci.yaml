name: CI
permissions: {}

on:
  push:
    branches: [develop, main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "run.sh"
      - "scripts/run-common.sh"
      - "packages/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [develop]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "run.sh"
      - "scripts/run-common.sh"
      - "packages/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run light validation
        run: ./run.sh --light
