name: Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - milestone-0.1.0
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

env:
  COMPACT_COMPILER_VERSION: 0.30.0
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"
  TURBO_CACHE_DIR: .turbo/cache

concurrency:
  group: trust-registry-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Audit, and Packaging Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Restore Turbo task cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: tr-turbo-v1-${{ runner.os }}-compact-${{ env.COMPACT_COMPILER_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}
          restore-keys: |
            tr-turbo-v1-${{ runner.os }}-compact-${{ env.COMPACT_COMPILER_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build all workspaces
        run: pnpm run build

      - name: Typecheck all workspaces
        run: pnpm run typecheck:light

      - name: Publish Turbo task cache from trusted branch
        if: github.event_name == 'push' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: tr-turbo-v1-${{ runner.os }}-compact-${{ env.COMPACT_COMPILER_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}

      - name: Audit dependencies
        run: pnpm audit --audit-level low
