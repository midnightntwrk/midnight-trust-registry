name: Milestone

on:
  pull_request:
    branches: [milestone-0.1.0]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: milestone-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Milestone Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/check-milestone-review.test.mjs scripts/check-milestone-commits.test.mjs
      - run: node scripts/check-milestone-review.mjs
      - run: node scripts/check-milestone-commits.mjs

  light:
    name: Milestone Light
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPACT_COMPILER_VERSION: 0.30.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: ./run.sh --light
