packages:
  - contracts/*
  - packages/*
  - adapters/*
  - docs-site

preferWorkspacePackages: true

blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Exact DID RC1 cohort approved for the Ledger 9 migration; remove after 2026-11-22 UTC.
  - "@midnight-ntwrk/midnight-did@1.0.0-rc1"
  - "@midnight-ntwrk/midnight-did-contract@1.0.0-rc1"
  - "@midnight-ntwrk/midnight-did-domain@1.0.0-rc1"
  - "@midnight-ntwrk/midnight-did-jubjub-schnorr@1.0.0-rc1"
  # Exact published VC RC1 cohort for Ledger 9; remove after 2026-11-24 UTC.
  - "@midnight-ntwrk/credential-compact@1.0.0-rc1"
  - "@midnight-ntwrk/credential-did-midnight@1.0.0-rc1"
  # Official 2026-11-17 Ledger 9 client patch. Remove after 2026-11-25 UTC.
  - "@midnight-ntwrk/compact-js@3.0.2"
  - "@midnight-ntwrk/midnight-js-compact@5.0.1"
  - "@midnight-ntwrk/midnight-js-contracts@5.0.1"
  - "@midnight-ntwrk/midnight-js-http-client-proof-provider@5.0.1"
  - "@midnight-ntwrk/midnight-js-indexer-public-data-provider@5.0.1"
  - "@midnight-ntwrk/midnight-js-level-private-state-provider@5.0.1"
  - "@midnight-ntwrk/midnight-js-node-zk-config-provider@5.0.1"
  - "@midnight-ntwrk/midnight-js-protocol@5.0.1"
  - "@midnight-ntwrk/midnight-js-types@5.0.1"
  - "@midnight-ntwrk/midnight-js-utils@5.0.1"
  - "@midnight-ntwrk/testkit-js@5.0.1"
  - "@midnightntwrk/ledger-v9@1.0.2"
  - "@midnightntwrk/onchain-runtime-v4@4.0.2"
  - "@midnightntwrk/wallet-sdk@2.0.1"
  - "@midnightntwrk/wallet-sdk-prover-client@2.0.1"
  - "@midnightntwrk/wallet-sdk-address-format@4.0.1"
  - "@midnightntwrk/wallet-sdk-utilities@1.3.1"
  - "@midnightntwrk/wallet-sdk-runtime@2.0.1"
  - "@midnightntwrk/wallet-sdk-shielded@4.0.1"
  - "@midnightntwrk/wallet-sdk-facade@5.0.1"
  - "@midnightntwrk/wallet-sdk-dust-wallet@5.1.0"
  - "@midnightntwrk/wallet-sdk-node-client@2.0.1"
  - "@midnightntwrk/wallet-sdk-capabilities@4.0.1"
  - "@midnightntwrk/wallet-sdk-indexer-client@2.0.1"
  - "@midnightntwrk/wallet-sdk-unshielded-wallet@4.0.1"
  # Required by the tested testkit patch; this already matures on 2026-11-19 UTC.
  - "@midnightntwrk/zkir-v3@3.2.1"

# Temporary audit exception; mirrors osv-scanner.toml (which carries the
# expiry date). Remove when a patched picomatch (> 4.0.7) is released.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf # picomatch ReDoS, no fix available; dev tooling only

overrides:
  "@effect/platform": 0.97.1
  "@midnight-ntwrk/credential-compact": 1.0.0-rc1
  "@midnight-ntwrk/credential-did-midnight": 1.0.0-rc1
  "@midnight-ntwrk/midnight-did": 1.0.0-rc1
  "@midnight-ntwrk/midnight-did-contract": 1.0.0-rc1
  "@midnight-ntwrk/midnight-did-domain": 1.0.0-rc1
  "@midnight-ntwrk/midnight-did-jubjub-schnorr": 1.0.0-rc1
  "vitest>vite": 7.3.7
  "vitepress>vite": 6.4.5
  "esbuild@<0.25.0": 0.28.1
  "mermaid>katex": 0.18.2
  "esbuild@>=0.27.3 <0.28.1": 0.28.1
  postcss: 8.5.23
  js-yaml: 4.3.2
  "brace-expansion@<5.0.12": 5.0.12
  "nanoid@<3.3.18": 3.3.18
