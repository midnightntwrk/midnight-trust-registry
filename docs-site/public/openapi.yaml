openapi: 3.1.0
info:
  title: Midnight Trust Registry local reference API
  version: 0.1.0
  description: >-
    HTTP projection of a local snapshot/workspace and optional trusted governed
    ports. A response is not independently authenticated ledger evidence.
    Packaged CLI read routes work without trusted ports; private/governed routes
    return 503 unless an embedding host installs the corresponding port.
    The local-ledger 0.1.0 profile supports current decisions only. Historical
    authorization, recognition, and TRQP decision/evidence routes return 501;
    fixture-backed mode retains its development-only historical behavior.
servers:
  - url: http://127.0.0.1:4400
    description: Local reference server only
# There is no global HTTP authentication scheme. Governed mutations verify
# signed request bodies through trusted ports; public query routes are anonymous.
security:
  - {}
tags:
  - name: Query
  - name: Private intake
  - name: Governed
  - name: Unsafe demo
x-parameters:
  role: &role
    name: role
    in: path
    required: true
    schema: { type: string, enum: [issuer, verifier, auditor] }
  decisionRole: &decisionRole
    name: role
    in: path
    required: true
    schema: { type: string, enum: [issuer, verifier] }
  governedRole: &governedRole
    name: role
    in: path
    required: true
    schema: { type: string, enum: [issuer, verifier, auditor, maintainer, recognition] }
  id: &id
    name: id
    in: path
    required: true
    schema: { type: string, minLength: 1 }
  action: &action
    name: action
    in: path
    required: true
    schema: { type: string, enum: [approve, activate, suspend, revoke, archive] }
  applicationAction: &applicationAction
    name: action
    in: path
    required: true
    schema: { type: string, enum: [approve, activate, suspend, revoke, archive] }
x-responses:
  query: &queryResponses
    '200': { description: Query result; independently verify evidence before relying on it }
    '400': { $ref: '#/components/responses/BadRequest' }
    '404': { $ref: '#/components/responses/NotFound' }
    '424': { $ref: '#/components/responses/MissingEvidence' }
  historical: &historicalResponses
    '200': { description: Fixture-backed historical result; not local-ledger 0.1.0 evidence }
    '400': { $ref: '#/components/responses/BadRequest' }
    '404': { $ref: '#/components/responses/NotFound' }
    '424': { $ref: '#/components/responses/MissingEvidence' }
    '501': { $ref: '#/components/responses/HistoricalOutOfScope' }
  governed: &governedResponses
    '200': { description: Prepared signing context }
    '201': { description: One-use challenge created by the trusted intake port }
    '202': { description: Accepted by the injected port; not network finality }
    '400': { $ref: '#/components/responses/BadRequest' }
    '403': { $ref: '#/components/responses/Forbidden' }
    '409': { $ref: '#/components/responses/Conflict' }
    '503': { $ref: '#/components/responses/PortUnavailable' }
components:
  schemas:
    ProposalEvidenceSnapshot:
      type: object
      description: >-
        Finalized-ledger projection only. Consumers must independently establish
        ledger finality and inclusion. The retained verifier signature is checked;
        current key lifecycle is not proposal-time status.
      required: [role, authorizationId, eventHash, evidenceCommitment, verifierAuthorizationId,
        verifierDidCommitment, verifierKeyIdCommitment, verifierSuite, policyCommitment,
        policyVersion, verifierPublicKey, verifierSignature, subjectDidCommitment,
        grantPolicyIdCommitment, proposedAtSequence, boundActionPayloadHash, signatureVerified]
      properties:
        role: { type: string, enum: [issuer, verifier, auditor, maintainer, recognition] }
        authorizationId: { type: string }
        eventHash: { $ref: '#/components/schemas/Hex32' }
        evidenceCommitment: { $ref: '#/components/schemas/Hex32' }
        verifierAuthorizationId: { $ref: '#/components/schemas/Hex32' }
        verifierDidCommitment: { $ref: '#/components/schemas/Hex32' }
        verifierKeyIdCommitment: { $ref: '#/components/schemas/Hex32' }
        verifierSuite: { $ref: '#/components/schemas/Hex32' }
        policyCommitment: { $ref: '#/components/schemas/Hex32' }
        policyVersion: { type: string, pattern: '^[0-9]+$' }
        verifierPublicKey: { $ref: '#/components/schemas/JubjubPoint' }
        subjectDidCommitment: { $ref: '#/components/schemas/Hex32' }
        grantPolicyIdCommitment: { $ref: '#/components/schemas/Hex32' }
        proposedAtSequence: { type: string, pattern: '^[0-9]+$' }
        boundActionPayloadHash: { $ref: '#/components/schemas/Hex32' }
        signatureVerified: { type: boolean, const: true }
        verifierSignature:
          type: object
          required: [announcement, response]
          properties:
            announcement: { $ref: '#/components/schemas/JubjubPoint' }
            response: { type: string, pattern: '^[0-9]+$' }
    Hex32: { type: string, pattern: '^0x[0-9a-f]{64}$' }
    JubjubPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: string, pattern: '^[0-9]+$' }
        y: { type: string, pattern: '^[0-9]+$' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
      additionalProperties: true
    AuthorizationLookup:
      type: object
      required: [role, subjectDid, resourceId]
      properties:
        role: { type: string, enum: [issuer, verifier, auditor] }
        subjectDid: { type: string, minLength: 1 }
        resourceId:
          type: string
          description: tr:issuer-resource:v1 hash for issuer; tr:request-resource:v1 hash for verifier/auditor
        resourceType: { type: string }
        trustLevel: { type: string }
      additionalProperties: true
    HistoricalAuthorizationLookup:
      allOf:
        - $ref: '#/components/schemas/AuthorizationLookup'
        - type: object
          required: [at]
          properties:
            at: { type: string, format: date-time }
    TimestampedEvidenceResponse:
      type: object
      required: [evaluatedAt, trustedAtTime, statusAtTime, epoch, entry, bundle]
      properties:
        evaluatedAt: { type: string, format: date-time }
        trustedAtTime: { type: boolean }
        statusAtTime: { type: [string, 'null'] }
        epoch: { type: [object, 'null'] }
        entry: { type: object }
        bundle:
          type: object
          description: Trust Registry evidence bundle requiring independent epoch and proof verification.
    RecognitionLookup:
      type: object
      required: [recognizedAuthorityDid, scopeResourceId]
      properties:
        recognizedAuthorityDid: { type: string }
        recognizedRegistryId: { type: string }
        scopeResourceType: { type: string }
        scopeResourceId: { type: string }
        scopeContext: { type: object, additionalProperties: { type: string } }
        trustLevel: { type: string }
        at: { type: string, format: date-time }
      additionalProperties: false
    VpSubmission:
      type: object
      required: [nonce, challengeHash, presentation]
      properties:
        nonce: { type: string, description: Hex nonce from the issued one-use challenge }
        challengeHash: { type: string, description: Hex challenge commitment }
        presentation: { type: object, description: Signed Midnight VP; private, never log or return }
      additionalProperties: false
    GovernedSigners:
      type: object
      required: [prepared, signers]
      properties:
        prepared: { type: object, description: Exact current prepare response }
        signers:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required: [keyId, publicKey, signature]
            properties:
              keyId: { type: string }
              publicKey:
                type: object
                required: [x, y]
                properties:
                  x: { type: string }
                  y: { type: string }
              signature: { type: string, description: Canonical JubJub Schnorr signature }
      additionalProperties: true
    AtomicMaintainerRecovery:
      type: object
      required: [maintainerId, evidenceHash, thresholds]
      properties:
        maintainerId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        evidenceHash: { type: string, pattern: '^0x[0-9a-f]{64}$', description: Operator-supplied commitment to the recovery evidence }
        thresholds:
          type: object
          required: [default, emergency, archival]
          properties:
            default: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
            emergency: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
            archival: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
          additionalProperties: false
      additionalProperties: false
    AtomicMaintainerRecoverySubmission:
      type: object
      required: [maintainerId, evidenceHash, thresholds, prepared, signers]
      properties:
        maintainerId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        evidenceHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        thresholds: { $ref: '#/components/schemas/AtomicMaintainerRecovery/properties/thresholds' }
        prepared: { type: object, description: Exact current atomic-recovery prepare response }
        signers: { $ref: '#/components/schemas/GovernedSigners/properties/signers' }
      additionalProperties: false
    EvidenceVerifierKeyStatusAction:
      type: object
      required: [authorizationId, reasonHash]
      properties:
        authorizationId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        reasonHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
      additionalProperties: false
    EvidenceVerifierKeyRotationAction:
      type: object
      required: [authorizationId, reasonHash, newAuthorizationId, newKeyIdCommitment, newPublicKey]
      properties:
        authorizationId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        reasonHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        newAuthorizationId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        newKeyIdCommitment: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        newPublicKey:
          type: object
          required: [x, y]
          properties:
            x: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
            y: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
          additionalProperties: false
      additionalProperties: false
    EvidenceVerifierKeyStatusSubmission:
      type: object
      required: [authorizationId, reasonHash, prepared, signers]
      properties:
        authorizationId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        reasonHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        prepared: { type: object, description: Exact current lifecycle prepare response }
        signers: { $ref: '#/components/schemas/GovernedSigners/properties/signers' }
      additionalProperties: false
    EvidenceVerifierKeyRotationSubmission:
      type: object
      required: [authorizationId, reasonHash, newAuthorizationId, newKeyIdCommitment, newPublicKey, prepared, signers]
      properties:
        authorizationId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        reasonHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        newAuthorizationId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        newKeyIdCommitment: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        newPublicKey: { $ref: '#/components/schemas/EvidenceVerifierKeyRotationAction/properties/newPublicKey' }
        prepared: { type: object, description: Exact current lifecycle prepare response }
        signers: { $ref: '#/components/schemas/GovernedSigners/properties/signers' }
      additionalProperties: false
    RecognitionProposalRecovery:
      type: object
      required: [receiptId, evidenceCommitment]
      properties:
        receiptId: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        evidenceCommitment: { type: string, pattern: '^0x[0-9a-f]{64}$' }
      additionalProperties: false
    DecisionEvidenceResponse:
      type: object
      required: [verification, evidence]
      properties:
        verification: { type: string, enum: [client-required] }
        evidence:
          type: object
          description: Structurally parsed tr-decision-evidence-v1 bundle; the consumer must independently authenticate the accepted epoch, quorum, current grant, DID state, and inclusion proof before use.
      additionalProperties: false
  responses:
    BadRequest: { description: Invalid path, query, or body }
    NotFound: { description: Record not found }
    Forbidden: { description: Actor, scope, or signer not authorized }
    Conflict: { description: Stale context, replay, or workspace lock }
    MissingEvidence: { description: Required historical bundle or epoch unavailable }
    HistoricalOutOfScope: { description: Historical decisions are outside the local-ledger 0.1.0 profile }
    PortUnavailable: { description: Trusted port or resolver not installed }
paths:
  /health:
    get:
      tags: [Query]
      summary: Read local source health and registry ID
      description: Local-ledger mode includes the finalized checkpoint hash read by the API process and its startup-verified plan digest; neither independently proves network finality.
      responses: *queryResponses
  /v1/registry:
    get:
      tags: [Query]
      summary: Read registry record
      responses: *queryResponses
  /v1/registry/summary:
    get:
      tags: [Query]
      summary: Read role/status counts and current epoch summary
      responses: *queryResponses
  /v1/registry/mutation-context:
    get:
      tags: [Governed]
      summary: Read workspace revision, epoch, and host evaluation time for a DID-signed intent
      description: Workspace source only. Context is advisory and can become stale immediately; evaluatedAt is the host clock, not Midnight consensus time.
      responses: *governedResponses
  /v1/epochs/current:
    get:
      tags: [Query]
      summary: Read current projected epoch
      responses: *queryResponses
  /v1/epochs/resolve:
    get:
      tags: [Query]
      summary: Select an epoch for a timestamp
      parameters:
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses: *queryResponses
  /v1/epochs/{id}:
    parameters: [*id]
    get:
      tags: [Query]
      summary: Read a named epoch
      responses: *queryResponses
  /v1/authorizations/{role}:
    parameters: [*role]
    get:
      tags: [Query]
      summary: List role grants
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses: *queryResponses
  /v1/authorizations/{role}/{id}:
    parameters: [*role, *id]
    get:
      tags: [Query]
      summary: Read a scoped authorization record
      responses: *queryResponses
  /v1/authorizations/{role}/{id}/evidence:
    parameters: [*role, *id]
    get:
      tags: [Query]
      summary: Read authorization evidence bundle
      responses: *queryResponses
  /v1/decision-evidence/{role}/{id}:
    parameters: [*decisionRole, *id]
    get:
      tags: [Query]
      summary: Fetch unverified issuer or verifier decision evidence from a finalized source
      description: The route is unavailable without a trusted reader. The response is not an authorization decision; clients must independently verify accepted epoch and DID anchors and current-state currency.
      responses:
        '200':
          description: Structurally valid bundle requiring independent client verification
          content: { application/json: { schema: { $ref: '#/components/schemas/DecisionEvidenceResponse' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/PortUnavailable' }
  /v1/authorizations/evaluate:
    post:
      tags: [Query]
      summary: Evaluate authorization at a requested instant
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HistoricalAuthorizationLookup' } } }
      responses: *historicalResponses
  /v1/authorizations/evaluate/evidence:
    post:
      tags: [Query]
      summary: Export timestamp-selected authorization evidence
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope. A fixture response is not proof of current trust.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HistoricalAuthorizationLookup' } } }
      responses:
        '200':
          description: Exact-scope temporal evaluation and selected evidence bundle
          content: { application/json: { schema: { $ref: '#/components/schemas/TimestampedEvidenceResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/MissingEvidence' }
        '501': { $ref: '#/components/responses/HistoricalOutOfScope' }
  /v1/authorizations/resolve:
    post:
      tags: [Query]
      summary: Resolve current exact-scope authorization
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthorizationLookup' } } }
      responses: *queryResponses
  /v1/recognitions:
    get:
      tags: [Query]
      summary: List scoped external recognitions
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses: *queryResponses
  /v1/recognitions/{id}:
    parameters: [*id]
    get:
      tags: [Query]
      summary: Read a recognition record
      responses: *queryResponses
  /v1/recognitions/{id}/evidence:
    parameters: [*id]
    get:
      tags: [Query]
      summary: Read recognition evidence
      responses: *queryResponses
  /v1/recognitions/evaluate:
    post:
      tags: [Query]
      summary: Evaluate recognition at a requested instant
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecognitionLookup' } } }
      responses: *historicalResponses
  /v1/recognitions/evaluate/evidence:
    post:
      tags: [Query]
      summary: Export timestamp-selected recognition evidence
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope. A fixture response is not proof of current trust.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecognitionLookup' } } }
      responses:
        '200':
          description: Exact-scope temporal evaluation and selected evidence bundle
          content: { application/json: { schema: { $ref: '#/components/schemas/TimestampedEvidenceResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/MissingEvidence' }
        '501': { $ref: '#/components/responses/HistoricalOutOfScope' }
  /v1/recognitions/resolve:
    post:
      tags: [Query]
      summary: Resolve current scoped recognition
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecognitionLookup' } } }
      responses: *queryResponses
  /v1/trqp/metadata/{id}:
    parameters: [*id]
    get:
      tags: [Query]
      summary: Read TRQP authority metadata projection
      responses: *queryResponses
  /v1/trqp/authorizations/query:
    post:
      tags: [Query]
      summary: Query TRQP authorizations
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope.
      responses: *historicalResponses
  /v1/trqp/authorizations/evidence:
    post:
      tags: [Query]
      summary: Retrieve TRQP authorization evidence
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope.
      responses: *historicalResponses
  /v1/trqp/recognitions/query:
    post:
      tags: [Query]
      summary: Query TRQP recognitions
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope.
      responses: *historicalResponses
  /v1/trqp/recognitions/evidence:
    post:
      tags: [Query]
      summary: Retrieve TRQP recognition evidence
      description: Fixture-mode history only; local-ledger 0.1.0 returns 501 historical-decisions-out-of-scope.
      responses: *historicalResponses
  /v1/pending-applications:
    post:
      tags: [Private intake]
      summary: Register a DID-signed pending application
      responses: *governedResponses
  /v1/application-evidence/{id}/binding:
    parameters: [*id]
    get:
      tags: [Private intake]
      summary: Read applicant-authorized pending binding
      responses: *governedResponses
  /v1/application-evidence/{id}/challenges:
    parameters: [*id]
    post:
      tags: [Private intake]
      summary: Issue a one-use VP challenge
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, maxProperties: 0 } } }
      responses: *governedResponses
  /v1/application-evidence/{id}/submissions:
    parameters: [*id]
    post:
      tags: [Private intake]
      summary: Verify a private VP and persist redacted evidence
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VpSubmission' } } }
      responses: *governedResponses
  /v1/application-evidence/{id}/receipt:
    parameters: [*id]
    get:
      tags: [Private intake]
      summary: Recover applicant-authorized redacted receipt
      responses: *governedResponses
  /v1/recognition-evidence/{id}/challenges:
    parameters: [*id]
    post:
      tags: [Private intake]
      summary: Issue accredited-recognition challenge
      responses: *governedResponses
  /v1/recognition-evidence/{id}/submissions:
    parameters: [*id]
    post:
      tags: [Private intake]
      summary: Verify accreditation VP and authority assertion
      responses: *governedResponses
  /v1/recognition-evidence/{id}/accepted:
    parameters: [*id]
    get:
      tags: [Private intake]
      summary: Read authorized accepted recognition receipt
      responses: *governedResponses
  /v1/governed/{role}/{id}/proposal/prepare:
    parameters: [*governedRole, *id]
    post:
      tags: [Governed]
      summary: Prepare exact deployment- and policy-bound proposal digest
      responses: *governedResponses
  /v1/governed/{role}/{id}/proposal/submit:
    parameters: [*governedRole, *id]
    post:
      tags: [Governed]
      summary: Submit external evidence-verifier and maintainer signatures
      responses: *governedResponses
  /v1/governed/{role}/{id}/proposal/resolve:
    parameters: [*governedRole, *id]
    post:
      tags: [Governed]
      summary: Observe matching proposal without resubmission
      description: Available for issuer, verifier, auditor, and maintainer ports; recognition has a separate private recovery route.
      responses: *governedResponses
  /v1/governed/{role}/{id}/proposal/evidence:
    parameters: [*governedRole, *id]
    get:
      tags: [Query]
      summary: Project proposal verifier and policy evidence from a finalized ledger view
      description: >-
        Optional host-injected finalized ledger reader. This response is not a
        standalone finality or inclusion proof; absent records do
        not prove a submitted transaction failed.
      responses:
        '200':
          description: Proposal evidence snapshot
          content: { application/json: { schema: { $ref: '#/components/schemas/ProposalEvidenceSnapshot' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/PortUnavailable' }
  /v1/governed/recognition/{id}/proposal/resolve:
    parameters: [*id]
    post:
      tags: [Private intake]
      summary: Recover an admitted recognition proposal from finalized Compact evidence
      description: >-
        Requires host authentication, the exact accepted accreditation receipt,
        and a trusted finalized proposal reader. A not-observed result is
        ambiguous and must not trigger automatic resubmission.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecognitionProposalRecovery' } } }
      responses: *governedResponses
  /v1/governed/{role}/{id}/actions/{action}:
    parameters: [*governedRole, *id, *action]
    description: >-
      Externally signed lifecycle action. Archiving a proposed target is a
      quorum-governed denial that preserves the proposal in history without
      approval or activation timestamps.
    get:
      tags: [Governed]
      summary: Prepare current Compact action signer context
      responses: *governedResponses
    post:
      tags: [Governed]
      summary: Submit external JubJub signer bundle to Compact port
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GovernedSigners' } } }
      responses: *governedResponses
  /v1/governed/policy/thresholds/prepare:
    post:
      tags: [Governed]
      summary: Prepare policy threshold revision with deployment signing domain under old policy
      responses: *governedResponses
  /v1/governed/policy/thresholds/submit:
    post:
      tags: [Governed]
      summary: Submit signed threshold revision
      responses: *governedResponses
  /v1/governed/policy/maintainer-recovery/prepare:
    post:
      tags: [Governed]
      summary: Prepare atomic policy revision and active-maintainer suspension under the old quorum
      description: The target cannot sign. The old quorum is the larger of default and emergency thresholds; the caller supplies a recovery-evidence commitment, and no reduced-quorum state is published before suspension.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AtomicMaintainerRecovery' } } }
