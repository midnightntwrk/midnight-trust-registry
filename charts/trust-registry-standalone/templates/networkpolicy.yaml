apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tr.fullname" . }}-default-deny
  labels:
    app.kubernetes.io/name: trust-registry-standalone
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/part-of: trust-registry-standalone
  policyTypes: [Ingress, Egress]
{{- range $role, $callers := dict "node" (list "indexer" "api" "operator" "actor") "indexer" (list "api" "operator" "actor") "proof-server" (list "operator" "actor") "api" (list "operator" "actor") "admin" (list "operator" "actor") "applicant" (list "operator" "actor") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tr.componentName" (dict "root" $ "component" $role) }}-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "tr.selector" (dict "root" $ "component" $role) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
      {{- range $caller := $callers }}
        - podSelector:
            matchLabels:
              {{- if or (eq $caller "operator") (eq $caller "actor") }}
              trust-registry.midnight.network/role: {{ $caller }}
              {{- else }}
              {{- include "tr.selector" (dict "root" $ "component" $caller) | nindent 14 }}
              {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ index (dict "node" 9944 "indexer" 8088 "proof-server" 6300 "api" 4400 "admin" 4173 "applicant" 4173) $role }}
{{- end }}
{{- range $role, $destinations := dict "indexer" (list "node") "api" (list "node" "indexer") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tr.componentName" (dict "root" $ "component" $role) }}-egress
spec:
  podSelector:
    matchLabels:
      {{- include "tr.selector" (dict "root" $ "component" $role) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $destination := $destinations }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "tr.selector" (dict "root" $ "component" $destination) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ index (dict "node" 9944 "indexer" 8088) $destination }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.dnsNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
